<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#0D131C"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 60) scale(420)">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 280) scale(380)">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1A212C" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1280" height="320" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glowCyan)"/>
    <rect width="1280" height="320" fill="url(#glowViolet)"/>

    <!-- Janela de terminal decorativa -->
    <g transform="translate(700, 60)">
      <rect x="0" y="0" width="500" height="220" rx="10" fill="#10151D" stroke="#202836" stroke-width="1.5"/>
      <rect x="0" y="0" width="500" height="34" rx="10" fill="#161C26"/>
      <rect x="0" y="24" width="500" height="10" fill="#161C26"/>
      <circle cx="20" cy="17" r="6" fill="#FF5F57"/>
      <circle cx="42" cy="17" r="6" fill="#FEBC2E"/>
      <circle cx="64" cy="17" r="6" fill="#28C840"/>
      <text x="250" y="21" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#5B6472">perfil.sh</text>

      <text x="24" y="70" font-family="JetBrains Mono, monospace" font-size="15" fill="#8B96A5">$ whoami</text>
      <text x="24" y="96" font-family="JetBrains Mono, monospace" font-size="15" fill="#E6EDF3">Gabriel Perrucho</text>
      <text x="24" y="130" font-family="JetBrains Mono, monospace" font-size="15" fill="#8B96A5">$ cat cargo.txt</text>
      <text x="24" y="156" font-family="JetBrains Mono, monospace" font-size="15" fill="#4FD1C5">Desenvolvedor em formação</text>
      <text x="24" y="190" font-family="JetBrains Mono, monospace" font-size="15" fill="#F2B675">▍</text>
    </g>

    <!-- Texto principal -->
    <text x="70" y="140" font-family="Space Grotesk, sans-serif" font-size="52" font-weight="700" fill="#E6EDF3">Gabriel Perrucho</text>
    <text x="70" y="178" font-family="JetBrains Mono, monospace" font-size="20" fill="#4FD1C5">&gt; Systems Analysis and Development</text>
    <text x="70" y="212" font-family="Inter, sans-serif" font-size="16" fill="#8B96A5">Project development focused on clean code and knowledge acquisition.</text>

    <!-- Tag decorativa -->
    <rect x="70" y="234" width="230" height="30" rx="15" fill="#10151D" stroke="#202836"/>
    <circle cx="90" cy="249" r="4" fill="#28C840"/>
    <text x="104" y="253" font-family="JetBrains Mono, monospace" font-size="13" fill="#8B96A5">Available for businesses.</text>
  </g>
</svg>
